<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#1e3a8a"/>
  
  <!-- Steering Wheel Outer Ring -->
  <circle cx="32" cy="32" r="22" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Steering Wheel Center Hub -->
  <circle cx="32" cy="32" r="7" fill="#10b981"/>
  
  <!-- Steering Wheel Spokes -->
  <line x1="10" y1="32" x2="25" y2="32" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="39" y1="32" x2="54" y2="32" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="32" y1="39" x2="32" y2="54" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Speed Dash Top Accent -->
  <circle cx="32" cy="10" r="2.5" fill="#facc15"/>
</svg>